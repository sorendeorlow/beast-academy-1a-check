  :root{
    --ground:#F4F3F1;
    --paper:#FFFFFF;
    --ink:#12211E;
    --ink-soft:#4A554F;
    --forest:#3F6B34;
    --forest-dark:#2C4E24;
    --forest-tint:#E7EFE1;
    --line:#DBD9D2;
    --grey-btn:#E9E8E4;
    --coral:#F58EA0;
    --blue:#6B93E8;
    --gold:#EBCB92;
    --wrong:#C25B5B;
    --wrong-bg:#F6E6E4;
    --retry:#B67E22;
    --serif:'PT Serif',Georgia,'Times New Roman',serif;
    --sans:'Roboto Flex',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--ground);
    min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  }
  .app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 16px 22px}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:5;padding:14px 2px 12px;
    background:linear-gradient(180deg,var(--ground) 74%,rgba(244,243,241,0));
    display:flex;flex-direction:column;gap:11px;}
  .top-row{display:flex;align-items:center;gap:12px}
  .bulb{width:46px;height:46px;flex:0 0 auto;transition:transform .3s ease}
  .bulb.happy{animation:pulse .7s ease}
  .bulb.oops{animation:wobble .5s ease}
  @keyframes pulse{0%,100%{transform:scale(1)}35%{transform:scale(1.12)}}
  @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
  .b-glass{fill:var(--paper);stroke:var(--ink);stroke-width:4;transition:fill .3s}
  .b-line{stroke:var(--ink);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .b-rays{stroke:var(--gold);stroke-width:4;stroke-linecap:round;opacity:0;transition:opacity .3s}
  .bulb.happy .b-glass{fill:var(--gold)}
  .bulb.happy .b-rays{opacity:1}
  .steplabel{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--forest)}
  .steplabel b{color:var(--ink)}
  .pips{display:flex;gap:4px;margin-top:5px}
  .pip{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .25s,transform .25s}
  .pip.done{background:var(--forest)}
  .pip.miss{background:var(--coral)}
  .pip.now{background:var(--ink);transform:scaleY(1.9)}

  /* ---------- card / content ---------- */
  .stage{flex:1;display:flex;flex-direction:column;padding-top:4px}
  .card{background:var(--paper);border-radius:var(--r);border:1px solid var(--line);
    box-shadow:0 10px 30px -20px rgba(18,33,30,.4);
    padding:22px 18px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;
    animation:rise .3s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .instr{display:flex;align-items:flex-start;gap:10px}
  .instr h1{font-family:var(--serif);font-size:23px;line-height:1.28;margin:0;font-weight:700;text-wrap:balance;flex:1}
  .speak{flex:0 0 auto;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);
    background:var(--ground);color:var(--forest);font-size:19px;cursor:pointer;display:grid;place-items:center;transition:transform .1s,background .2s}
  .speak:active{transform:scale(.9);background:var(--forest-tint)}
  .subhint{font-family:var(--sans);font-size:13.5px;color:var(--ink-soft);margin:-8px 0 0;line-height:1.4}
  .subhint em{color:var(--forest);font-style:normal;font-weight:600}

  /* ---------- compare ---------- */
  .options{display:flex;gap:12px;align-items:center;justify-content:center}
  .options.stacked{flex-direction:column}
  .opt{flex:1;min-width:0;border:2px solid var(--line);border-radius:10px;background:var(--ground);
    padding:16px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:118px;
    transition:border-color .15s,transform .1s,box-shadow .2s,background .2s;position:relative}
  .options.stacked .opt{width:100%;min-height:72px}
  .opt:active{transform:scale(.98)}
  .opt.sel{border-color:var(--forest);background:var(--forest-tint);box-shadow:0 0 0 3px rgba(63,107,52,.18)}
  .opt.right{border-color:var(--forest);background:var(--forest-tint)}
  .opt.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
  .opt .badge{position:absolute;top:-11px;right:-8px;font-size:21px;opacity:0;transform:scale(.5);transition:.2s}
  .opt.right .badge,.opt.wrong .badge{opacity:1;transform:scale(1)}
  .orword{font-family:var(--serif);font-style:italic;color:var(--ink-soft);font-size:16px}
  .dotwrap{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;align-content:center;max-width:150px}
  .dotwrap.row{flex-wrap:nowrap;max-width:none}
  .dotwrap.row.tight{gap:6px}
  .dotwrap.row.wide{gap:15px}
  .dotgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;justify-items:center}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--ink);flex:0 0 auto}
  .dotgrid .dot{width:12px;height:12px}
  .dotwrap.row .dot{width:14px;height:14px}

  /* ---------- count ---------- */
  .countbox{display:flex;justify-content:center;padding:4px 0}
  .countbox .dotwrap{max-width:200px;gap:11px}
  .countbox .dot{width:19px;height:19px}

  /* ---------- entry / numpad ---------- */
  .field-single{align-self:center;min-width:96px;height:72px;border-radius:10px;border:2px dashed var(--forest);
    background:var(--forest-tint);display:grid;place-items:center;font-family:var(--serif);font-size:40px;font-weight:700;
    font-variant-numeric:tabular-nums;color:var(--forest);padding:0 14px}
  .field-single.filled{border-style:solid}
  .wordq{font-family:var(--serif);font-size:23px;font-weight:400;text-align:center;line-height:1.5}
  .wordq .blankspot{display:inline-grid;place-items:center;min-width:52px;height:42px;vertical-align:middle;
    border-bottom:3px solid var(--forest);color:var(--forest);font-weight:700;font-variant-numeric:tabular-nums;margin:0 4px}
  .cells{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 12px;scrollbar-width:thin}
  .cell{flex:0 0 auto;width:44px;height:52px;border-radius:8px;display:grid;place-items:center;
    font-family:var(--serif);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .cell.fixed{background:var(--ground);border:1px solid var(--line);color:var(--ink)}
  .cell.blank{background:var(--forest-tint);border:2px dashed var(--forest);color:var(--forest);cursor:pointer;transition:.15s}
  .cell.blank.active{border-style:solid;box-shadow:0 0 0 3px rgba(63,107,52,.2);transform:translateY(-2px)}
  .cell.blank.ok{border-color:var(--forest);background:var(--forest-tint);border-style:solid;color:var(--forest)}
  .cell.blank.no{border-color:var(--wrong);background:var(--wrong-bg);border-style:solid;color:var(--wrong)}
  .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:2px}
  .key{height:56px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:25px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;
    transition:transform .08s,background .15s}
  .key:active{transform:scale(.94);background:var(--forest-tint)}
  .key.util{background:var(--ground);color:var(--forest);font-size:20px}

  /* ---------- connect ---------- */
  .connect{width:100%;aspect-ratio:1/.86;background:var(--ground);border-radius:10px;border:1px solid var(--line);touch-action:manipulation}
  .cline{stroke:var(--forest);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .cnode{cursor:pointer}
  .cnode circle{fill:var(--paper);stroke:var(--ink);stroke-width:2}
  .cnode.hit circle{fill:var(--forest);stroke:var(--forest)}
  .cnode.hit text{fill:var(--paper)}
  .cnode.next circle{stroke:var(--coral);stroke-width:3}
  .cnode.shake{animation:wobble .4s}
  .cnode text{font-family:var(--serif);font-size:8px;font-weight:700;fill:var(--ink);pointer-events:none}
  .connectside{font-size:13px;color:var(--ink-soft);font-weight:600;text-align:center}
  .connectside b{color:var(--forest);font-family:var(--serif)}

  /* ---------- feedback + footer ---------- */
  .feedback{min-height:24px;text-align:center;font-family:var(--serif);font-weight:700;font-size:17px;transition:.2s}
  .feedback.good{color:var(--forest)}
  .feedback.retry{color:var(--retry)}
  .feedback.neutral{color:var(--ink-soft)}
  .footer{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:9px}
  .btn{width:100%;height:58px;border:none;border-radius:8px;font-family:var(--sans);font-size:19px;font-weight:700;
    cursor:pointer;color:#fff;background:var(--forest);box-shadow:0 3px 0 0 var(--forest-dark);
    transition:transform .08s,box-shadow .08s,opacity .2s}
  .btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 0 var(--forest-dark)}
  .btn:disabled{opacity:.4;box-shadow:0 3px 0 0 #c9c6bf;cursor:default}
  .btn.ghost{background:var(--grey-btn);color:var(--ink);box-shadow:0 3px 0 0 #cfcdc6}
  .btn.ghost:active:not(:disabled){box-shadow:0 0 0 0 #cfcdc6}
  .skip{background:none;border:none;color:var(--ink-soft);font-weight:600;font-size:14px;cursor:pointer;padding:6px;text-decoration:underline}

  /* ---------- intro ---------- */
  .intro{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:24px}
  .hero-art{width:100%;max-width:320px;height:auto}
  .intro h1{font-family:var(--serif);font-size:29px;font-weight:700;margin:0;line-height:1.15;text-wrap:balance;color:var(--ink)}
  .intro h1 u{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-color:var(--forest)}
  .intro .lede{font-family:var(--sans);margin:0;color:var(--ink-soft);font-size:15px;line-height:1.5}
  .grown{background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;font-size:13px;color:var(--ink-soft);line-height:1.55}
  .grown b{color:var(--forest)}
  .grown .lbl{font-family:var(--sans);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--forest);display:block;margin-bottom:5px}

  /* ---------- results ---------- */
  .verdict{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:4px 0}
  .verdict .score{font-family:var(--serif);font-size:58px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
  .verdict .score small{font-size:26px;color:var(--ink-soft)}
  .banner{border-radius:10px;padding:13px 16px;font-family:var(--serif);font-weight:700;font-size:18px;width:100%;text-align:center}
  .banner.ready{background:var(--forest-tint);color:var(--forest)}
  .banner.almost{background:#FBF1DE;color:var(--retry)}
  .grid16{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .g16{border-radius:8px;padding:8px 4px;text-align:center;font-weight:700;font-size:13px;background:var(--ground);border:1px solid var(--line)}
  .g16 .n{font-family:var(--sans);font-size:11px;color:var(--ink-soft);display:block}
  .g16 .mk{font-size:17px}
  .g16.ok{background:var(--forest-tint);border-color:#cfe0c6}
  .g16.no{background:var(--wrong-bg);border-color:#eccfcc}

  .splash{position:absolute;pointer-events:none;border-radius:50%;opacity:0}
  .celebrate .splash{animation:splash .8s ease forwards}
  @keyframes splash{0%{opacity:1;transform:translateY(0) scale(.3)}100%{opacity:0;transform:translateY(-58px) scale(1.15)}}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;transition-duration:.05s!important}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
"use strict";

/* ---- line-art lightbulb mascot (lights up gold when correct) ---- */
function bulb(cls){
  return `<svg class="bulb ${cls||''}" viewBox="0 0 100 100" aria-hidden="true">
    <g class="b-rays">
      <line x1="50" y1="6" x2="50" y2="0"/>
      <line x1="24" y1="15" x2="20" y2="10"/>
      <line x1="76" y1="15" x2="80" y2="10"/>
      <line x1="10" y1="40" x2="4" y2="40"/>
      <line x1="90" y1="40" x2="96" y2="40"/>
    </g>
    <path class="b-glass" d="M50 14 C34 14 24 26 24 40 C24 51 31 57 35 63 L65 63 C69 57 76 51 76 40 C76 26 66 14 50 14 Z"/>
    <path class="b-line" d="M42 46 L47 38 L52 50 L57 42"/>
    <path class="b-line" d="M37 68 L63 68 M39 74 L61 74 M43 80 L57 80 L54 86 L46 86 Z"/>
  </svg>`;
}

/* ---- intro hero: AoPS-style hand-drawn math doodles ---- */
function heroArt(){
  return `<svg class="hero-art" viewBox="0 0 320 168" aria-hidden="true">
    <g fill="none" stroke="#12211E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <!-- dotted arcs from bulb -->
      <path d="M160 92 C120 108 96 116 74 122" stroke-dasharray="1 8"/>
      <path d="M160 92 C200 108 224 116 246 122" stroke-dasharray="1 8"/>
      <!-- lightbulb -->
      <path d="M160 30 C144 30 134 42 134 56 C134 67 141 73 145 79 L175 79 C179 73 186 67 186 56 C186 42 176 30 160 30 Z" fill="#EBCB92"/>
      <path d="M152 62 L157 54 L162 66 L167 58"/>
      <path d="M147 84 L173 84 M149 90 L171 90 M153 96 L167 96 L164 102 L156 102 Z"/>
      <!-- square root -->
      <path d="M22 84 L30 96 L40 60 L74 60"/>
      <text x="46" y="80" font-family="Georgia, serif" font-size="20" stroke="none" fill="#12211E">x</text>
      <!-- triangle (blue) -->
      <path d="M262 58 L286 58 L274 36 Z" fill="#6B93E8"/>
      <!-- circle -->
      <circle cx="288" cy="96" r="13"/>
      <!-- plus signs -->
      <path d="M44 116 L44 128 M38 122 L50 122"/>
      <path d="M280 132 L280 142 M275 137 L285 137"/>
      <!-- open book -->
      <path d="M78 150 C110 132 150 132 160 142 C170 132 210 132 242 150"/>
      <path d="M160 142 L160 158"/>
      <path d="M78 150 C110 158 150 158 160 158 C170 158 210 158 242 150" fill="#FFFFFF"/>
      <path d="M98 146 C120 140 145 140 156 146 M164 146 C175 140 200 140 222 146" stroke-width="1.6"/>
    </g>
  </svg>`;
}

/* ---- data ---- */
function dots(n){return Array.from({length:n}).map(()=>'<span class="dot"></span>').join('');}

const Q=[
  {type:'compare',instr:'Tap the box that has MORE dots.',layout:'side',opts:[{cls:'cluster',n:5},{cls:'cluster',n:4}],answer:0},
  {type:'compare',instr:'Tap the box that has MORE dots.',layout:'side',opts:[{cls:'cluster',n:6},{cls:'cluster',n:7}],answer:1},
  {type:'compare',instr:'Tap the row that has MORE dots.',layout:'stack',opts:[{cls:'row tight',n:7},{cls:'row wide',n:6}],answer:0,hint:'The longer row does not always have more!'},
  {type:'compare',instr:'Tap the box that has MORE dots.',layout:'side',opts:[{cls:'grid',n:25},{cls:'grid',n:24}],answer:0,hint:'Is there a way to tell without counting all 25?'},
  {type:'count',instr:'How many dots? Type the number.',n:7,answer:7},
  {type:'count',instr:'How many dots? Type the number.',n:12,answer:12},
  {type:'count',instr:'How many dots? Type the number.',n:14,answer:14},
  {type:'connect',instr:'Tap the dots in order, from the smallest number to the biggest.',
   pts:[{n:5,x:64,y:70},{n:6,x:22,y:47},{n:7,x:66,y:24},{n:8,x:48,y:80},{n:9,x:28,y:24},{n:10,x:72,y:47},{n:11,x:30,y:70},{n:12,x:50,y:12}]},
  {type:'connect',instr:'Tap the dots in order, from the smallest number to the biggest.',
   pts:[{n:8,x:46,y:47},{n:9,x:58,y:47},{n:10,x:60,y:63},{n:11,x:40,y:63},{n:12,x:40,y:31},{n:13,x:66,y:31},{n:14,x:72,y:78},{n:15,x:26,y:78},{n:16,x:26,y:14},{n:17,x:78,y:14}]},
  {type:'seq',instr:'Fill in the missing numbers.',hint:'Counting up by 1.',cells:[7,8,9,null,11,null,13,null,15,null,17,18]},
  {type:'seq',instr:'Fill in the missing numbers.',hint:'Counting down by 1.',cells:[20,19,18,null,null,null,14,null,null,null,10,null]},
  {type:'seq',instr:'Fill in the missing numbers.',hint:'Counting up by 1.',cells:[null,null,null,8,9,10,null,null,null,14,15,16]},
  {type:'word',instr:'Two more than five is ___.',pre:'Two more than five is',answer:7},
  {type:'word',instr:'Four more than seven is ___.',pre:'Four more than seven is',answer:11},
  {type:'word',instr:'Three less than eight is ___.',pre:'Three less than eight is',answer:5},
  {type:'word',instr:'Six more than nine is ___.',pre:'Six more than nine is',answer:15},
];
const TOTAL=Q.length;
Q.forEach(q=>{
  if(q.type==='seq'){
    const vals=q.cells.slice();
    const step=(function(){for(let i=1;i<vals.length;i++)if(vals[i]!=null&&vals[i-1]!=null)return vals[i]-vals[i-1];return 1;})();
    for(let i=0;i<vals.length;i++){
      if(vals[i]==null){
        if(vals[i-1]!=null)vals[i]=vals[i-1]+step;
        else{let j=i;while(vals[j]==null&&j<vals.length)j++;vals[i]=vals[j]-step*(j-i);}
      }
    }
    q.solved=vals;
    q.blanks=q.cells.map((c,i)=>c===null?i:-1).filter(i=>i>=0);
  }
});

const state={screen:'intro',qi:0,results:new Array(TOTAL).fill(null),work:{}};
function resetWork(){state.work={sel:null,fields:[],active:0,order:[],phase:'answer',attempts:0};}
function secondChance(i){return i>=4;}

function speak(text){try{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.9;u.pitch=1;speechSynthesis.speak(u);}catch(e){}}

const app=document.getElementById('app');
function render(){if(state.screen==='intro')return renderIntro();if(state.screen==='results')return renderResults();renderQuiz();}

function renderIntro(){
  app.innerHTML=`<div class="stage"><div class="card intro">
    ${heroArt()}
    <h1>Are you <u>ready</u> for<br>Beast Academy 1A?</h1>
    <p class="lede">16 short number puzzles. Tap your answers, and a grown-up can read along and help.</p>
    <div class="grown"><span class="lbl">For grown-ups</span>
    A child ready for 1A can answer at least <b>12 of 16</b>. They should already count &amp; write numbers to 20
    (ideally 100). Reading help is welcome, and puzzles 5&ndash;16 get a <b>second try</b> if the first answer is off.
    You'll get a full report at the end.</div>
  </div>
  <div class="footer"><button class="btn" id="start">Start the check</button></div>
  </div>`;
  document.getElementById('start').onclick=()=>{state.screen='quiz';state.qi=0;resetWork();render();};
}

function topbar(){
  const pips=Q.map((_,i)=>{
    let c='pip';
    if(i===state.qi)c+=' now';
    else if(state.results[i]==='correct')c+=' done';
    else if(state.results[i]==='wrong')c+=' miss';
    return `<div class="${c}"></div>`;
  }).join('');
  const w=state.work;
  const mcls=w.phase==='correct'?'happy':((w.phase==='wrong'||w.phase==='retry')?'oops':'');
  return `<div class="topbar"><div class="top-row">${bulb(mcls)}
    <div><div class="steplabel">Puzzle <b>${state.qi+1}</b> of ${TOTAL}</div>
    <div class="pips">${pips}</div></div></div></div>`;
}

function renderQuiz(){
  const q=Q[state.qi];
  app.innerHTML=topbar()+`<div class="stage"><div class="card" id="card">
    <div class="instr"><h1>${q.instr}</h1><button class="speak" id="speak" aria-label="Read aloud">&#128266;</button></div>
    ${q.hint?`<p class="subhint"><em>Hint:</em> ${q.hint}</p>`:''}
    <div id="body"></div>
    <div class="feedback" id="fb"></div>
    </div><div class="footer" id="foot"></div></div>`;
  document.getElementById('speak').onclick=()=>speak(q.instr+(q.hint?'. Hint. '+q.hint:''));
  const body=document.getElementById('body');
  ({compare:renderCompare,count:renderEntry,word:renderEntry,seq:renderEntry,connect:renderConnect})[q.type](q,body);
  renderFoot();
}

function optInner(o){
  if(o.cls==='grid')return `<div class="dotgrid">${dots(o.n)}</div>`;
  const rowcls=o.cls.startsWith('row')?('row '+o.cls.split(' ')[1]):'';
  return `<div class="dotwrap ${rowcls}">${dots(o.n)}</div>`;
}
function renderCompare(q,body){
  const w=state.work;const locked=w.phase!=='answer';
  const items=q.opts.map((o,i)=>{
    let c='opt';
    if(!locked&&w.sel===i)c+=' sel';
    if(locked){if(i===q.answer)c+=' right';else if(w.sel===i)c+=' wrong';}
    const badge=i===q.answer?'&#9989;':'&#10060;';
    return `<div class="${c}" data-i="${i}">${optInner(o)}<span class="badge">${badge}</span></div>`;
  });
  const or='<span class="orword">or</span>';
  body.innerHTML=`<div class="options ${q.layout==='stack'?'stacked':''}">${items[0]}${or}${items[1]}</div>`;
  if(!locked)body.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{w.sel=+el.dataset.i;renderCompare(q,body);renderFoot();});
}

function renderEntry(q,body){
  const w=state.work;
  if(!w.fields.length){w.fields=(q.type==='seq'?q.blanks.map(()=>''):['']);w.active=0;}
  let visual='';
  if(q.type==='count'){
    visual=`<div class="countbox"><div class="dotwrap">${dots(q.n)}</div></div>
      <div class="field-single ${w.fields[0]?'filled':''}">${w.fields[0]||'?'}</div>`;
  }else if(q.type==='word'){
    visual=`<div class="wordq">${q.pre} <span class="blankspot">${w.fields[0]||''}</span>.</div>`;
  }else if(q.type==='seq'){
    let bi=0;
    const cells=q.cells.map((c,i)=>{
      if(c!==null)return `<div class="cell fixed">${c}</div>`;
      const idx=bi++;const val=w.fields[idx];let cc='cell blank';
      if(w.phase==='correct'||w.phase==='wrong')cc+=(+val===q.solved[i])?' ok':' no';
      else if(idx===w.active)cc+=' active';
      return `<div class="${cc}" data-b="${idx}">${val||''}</div>`;
    }).join('');
    visual=`<div class="cells">${cells}</div>`;
  }
  const active=w.phase==='answer'||w.phase==='retry';
  body.innerHTML=visual+(active?numpad():'');
  if(active){
    if(q.type==='seq')body.querySelectorAll('.cell.blank').forEach(el=>el.onclick=()=>{w.active=+el.dataset.b;renderEntry(q,body);renderFoot();});
    body.querySelectorAll('.key').forEach(el=>el.onclick=()=>{
      const k=el.dataset.k;const cur=w.fields[w.active]||'';
      if(k==='del')w.fields[w.active]=cur.slice(0,-1);
      else if(cur.length<2)w.fields[w.active]=cur+k;
      renderEntry(q,body);renderFoot();
    });
  }
}
function numpad(){
  const keys=['1','2','3','4','5','6','7','8','9','del','0'];
  return `<div class="numpad">`+keys.map(k=>{
    if(k==='del')return `<button class="key util" data-k="del">&#9003;</button>`;
    if(k==='0')return `<button class="key" data-k="0">0</button><span></span>`;
    return `<button class="key" data-k="${k}">${k}</button>`;
  }).join('')+`</div>`;
}

function renderConnect(q,body){
  const w=state.work;
  const sorted=q.pts.slice().sort((a,b)=>a.n-b.n);
  const nextNum=w.order.length<sorted.length?sorted[w.order.length].n:null;
  const line=w.order.map((n,idx)=>{const p=q.pts.find(pt=>pt.n===n);return (idx===0?'M':'L')+p.x+' '+p.y;}).join(' ');
  const nodes=q.pts.map(p=>{
    const hit=w.order.includes(p.n);let c='cnode';if(hit)c+=' hit';else if(p.n===nextNum)c+=' next';
    return `<g class="${c}" data-n="${p.n}"><circle cx="${p.x}" cy="${p.y}" r="7"/><text x="${p.x}" y="${p.y+3}" text-anchor="middle">${p.n}</text></g>`;
  }).join('');
  body.innerHTML=`<svg class="connect" viewBox="0 0 100 86"><path class="cline" d="${line}"/>${nodes}</svg>
    <div class="connectside">Next: tap <b>${nextNum!=null?nextNum:'— all done!'}</b></div>`;
  if(w.phase==='answer')body.querySelectorAll('.cnode').forEach(g=>g.onclick=()=>{
    const n=+g.dataset.n;if(w.order.includes(n))return;
    if(n===nextNum){w.order.push(n);if(w.order.length===sorted.length){pass();return;}renderConnect(q,body);}
    else{g.classList.add('shake');setTimeout(()=>g.classList.remove('shake'),400);}
  });
}

function renderFoot(){
  const foot=document.getElementById('foot');if(!foot)return;
  const q=Q[state.qi],w=state.work;
  if(q.type==='connect'){
    if(w.phase==='correct')foot.innerHTML=btn('Next','',(state.qi===TOTAL-1?'next':'next'));
    else{foot.innerHTML=`<button class="skip" id="skip">Skip this one</button>`;document.getElementById('skip').onclick=()=>fail(true);}
    bindFoot();return;
  }
  if(w.phase==='correct'||w.phase==='wrong'){
    foot.innerHTML=btn(state.qi===TOTAL-1?'See results':'Next','','next');
  }else{
    foot.innerHTML=btn('Check','','check',!answerable());
  }
  bindFoot();
}
function btn(label,cls,act,dis){return `<button class="btn ${cls||''}" data-act="${act}" ${dis?'disabled':''}>${label}</button>`;}
function bindFoot(){const b=document.querySelector('#foot .btn');if(!b)return;b.onclick=()=>{const a=b.dataset.act;if(a==='next')next();else if(a==='check')check();};}
function answerable(){
  const q=Q[state.qi],w=state.work;
  if(q.type==='compare')return w.sel!==null;
  if(!w.fields.length)return false;
  return w.fields.every(v=>v!=='');
}
function feedback(msg,cls){const fb=document.getElementById('fb');if(fb){fb.textContent=msg;fb.className='feedback '+(cls||'');}}
function celebrate(){
  const card=document.getElementById('card');if(!card)return;
  card.classList.add('celebrate');
  const colors=['#3F6B34','#F58EA0','#6B93E8','#EBCB92'];
  for(let i=0;i<10;i++){
    const s=document.createElement('span');s.className='splash';
    const sz=8+i%3*6;s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.left=(10+i*8)+'%';s.style.top='55%';s.style.background=colors[i%4];s.style.animationDelay=(i*20)+'ms';
    card.appendChild(s);
  }
  setTimeout(()=>{if(card)card.classList.remove('celebrate');},900);
}
function pass(){
  state.results[state.qi]='correct';state.work.phase='correct';render();celebrate();
  const nice=['Nice work!','You got it!','Yes! Well done.','Great thinking!','Awesome!'];
  feedback(nice[state.qi%nice.length],'good');
}
function fail(fromSkip){
  const w=state.work,i=state.qi;
  if(!fromSkip&&secondChance(i)&&w.attempts<1){
    w.attempts++;w.phase='retry';w.sel=null;
    if(w.fields.length)w.fields=w.fields.map(()=>'');w.active=0;
    renderQuiz();feedback('Not quite — take one more try!','retry');return;
  }
  state.results[i]='wrong';w.phase='wrong';render();feedback("That's okay — let's keep going.",'neutral');
}
function check(){
  const q=Q[state.qi],w=state.work;let ok;
  if(q.type==='compare')ok=w.sel===q.answer;
  else if(q.type==='seq')ok=q.blanks.every((ci,bi)=>+w.fields[bi]===q.solved[ci]);
  else ok=+w.fields[0]===q.answer;
  if(ok)pass();else fail(false);
}
function next(){if(state.qi>=TOTAL-1){state.screen='results';render();return;}state.qi++;resetWork();render();}

function renderResults(){
  const score=state.results.filter(r=>r==='correct').length;
  const ready=score>=12;
  const grid=Q.map((q,i)=>{
    const ok=state.results[i]==='correct';
    return `<div class="g16 ${ok?'ok':'no'}"><span class="n">#${i+1}</span><span class="mk">${ok?'&#9989;':'&#10060;'}</span></div>`;
  }).join('');
  app.innerHTML=`<div class="stage"><div class="card">
    <div class="verdict">${bulb(ready?'happy':'')}
      <div class="score">${score}<small>/16</small></div>
      <div class="banner ${ready?'ready':'almost'}">${ready?'Ready for Beast Academy 1A!':'Almost there — keep practicing.'}</div>
    </div>
    <p class="subhint" style="text-align:center;margin:0">
      ${ready?'12 or more correct means your child is ready to start 1A.':'&ldquo;Ready&rdquo; means 12 of 16. A little more counting practice to 20 will help.'}
    </p>
    <div class="grid16">${grid}</div>
    <div class="grown"><span class="lbl">For grown-ups</span>
      Puzzle&nbsp;3 (rows) and puzzle&nbsp;4 (grids) are the classic traps &mdash; many kids assume the longer row wins,
      or count every dot instead of noticing the pattern. Puzzles 8&ndash;9 build the fine-motor skills used in
      Chapter&nbsp;2. Any counting method (fingers, drawing, objects) is fine for 13&ndash;16.</div>
    </div>
    <div class="footer"><button class="btn ghost" id="again">Try again</button></div>
  </div>`;
  document.getElementById('again').onclick=()=>{state.results=new Array(TOTAL).fill(null);state.qi=0;state.screen='quiz';resetWork();render();};
}

resetWork();render();
})();
</script>
</body>
</html>
